name: NookPhone
options:
  bundleIdPrefix: com.nook
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NookPhone:
    type: application
    platform: iOS
    sources: [Sources/App, Sources/Shared, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nook.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Phone-Info.plist
      properties:
        CFBundleDisplayName: Nook
        CFBundleShortVersionString: "0.7.2"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSFaceIDUsageDescription: Authenticate before approving an agent request.
        NSLocalNetworkUsageDescription: Connect to your paired Nook desktop on trusted Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nook]
    entitlements:
      path: Generated/Phone.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.nook.phone]
    dependencies:
      - target: NookWidgets
  NookWidgets:
    type: app-extension
    platform: iOS
    sources: [Sources/Widgets, Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nook.phone.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Nook Widgets
        CFBundleShortVersionString: "0.7.2"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nook.phone]
  NookPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: NookPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nook.phone.tests
schemes:
  NookPhone:
    build:
      targets:
        NookPhone: all
    test:
      targets: [NookPhoneTests]
