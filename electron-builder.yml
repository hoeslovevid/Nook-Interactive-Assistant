appId: com.nook.companion
productName: Nook
directories:
  output: dist
  buildResources: build
# Native Windows scripts and agent hooks need real filesystem paths.
asar: false
npmRebuild: false
files:
  - "*.js"
  - "*.html"
  - "*.css"
  - "package.json"
  - "lib/**"
  - "hooks/**"
  - "phone/**"
  - "assets/tray.png"
  - "assets/icon.png"
win:
  # Windows releases are currently unsigned; downloaded files still use SHA-512 integrity checks.
  verifyUpdateCodeSignature: false
  icon: build/icon.ico
  executableName: Nook
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: "Nook-Setup-${version}-${arch}.${ext}"
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nook
  uninstallDisplayName: Nook
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: hoeslovevid
  repo: Nook-Interactive-Assistant
  releaseType: release
  private: true
