plugins { id 'com.android.application' }
android {
    namespace 'com.nook.phone'
    compileSdk 35
    defaultConfig { applicationId 'com.nook.phone'; minSdk 30; targetSdk 35; versionCode 4; versionName '0.10.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('NOOK_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('NOOK_ANDROID_KEYSTORE'))
                storePassword System.getenv('NOOK_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('NOOK_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('NOOK_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { if (System.getenv('NOOK_ANDROID_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    lint { abortOnError true }
}
