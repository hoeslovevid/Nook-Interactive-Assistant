name: Desktop quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke:notch
      - run: npm run smoke:refinements
      - run: npm run smoke:polish
      - run: npm run smoke:local-ui
      - run: npm run smoke:pet
      - run: npm run smoke:expansion
      - run: npm run smoke:refined
      - run: npm run smoke:hub
      - name: Check visual-test result
        shell: pwsh
        run: |
          $result = Get-Content -LiteralPath dist/refinements-qa/result.json -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw $result.error }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-qa-node-${{ matrix.node }}
          path: |
            dist/refinements-qa/
            dist/notch-stability-qa/
            dist/polish-qa/
            dist/local-ai-ui/
            dist/pet-animation-qa/
            dist/expansion-qa/
            dist/refined-qa/
            dist/hub-qa/
