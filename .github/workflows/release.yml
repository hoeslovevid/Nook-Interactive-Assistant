name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Nook-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  build:
    needs: android
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version v$version" }
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: node scripts/verify-release.cjs
      - uses: actions/download-artifact@v4
        with:
          name: Nook-Android-debug
          path: dist/android
      - name: Prepare Android test build
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Move-Item -LiteralPath dist/android/app-debug.apk -Destination "dist/Nook-Android-$version-debug.apk"
      - name: Create checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/Nook-Setup-*.exe,dist/Nook-Android-*-debug.apk | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nook-Windows-installer
          path: |
            dist/Nook-Setup-*.exe
            dist/Nook-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/Nook-Android-*-debug.apk
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --draft --verify-tag --title "Nook $env:GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "Unable to create release" }
          }
          $assets = @(Get-ChildItem dist/Nook-Setup-*.exe,dist/Nook-Setup-*.exe.blockmap,dist/Nook-Android-*-debug.apk | ForEach-Object { $_.FullName }) + @("dist/SHA256SUMS.txt")
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload release assets" }
          gh release upload $env:GITHUB_REF_NAME dist/latest.yml --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload update metadata" }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish release" }
