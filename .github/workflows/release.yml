name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package.json version v$version" }
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Create checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/Nook-Setup-*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nook-Windows-installer
          path: |
            dist/Nook-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --title "Nook $env:GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "Unable to create release" }
          }
          $assets = @(Get-ChildItem dist/Nook-Setup-*.exe | ForEach-Object { $_.FullName }) + @("dist/SHA256SUMS.txt")
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Unable to upload release assets" }
