<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; media-src data:"
    />
    <title>Nook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="island" role="region" aria-label="Nook">
      <header class="top">
        <canvas class="seed" width="64" height="64" aria-hidden="true"></canvas>
        <p id="peek-line" class="peek-line"></p>
        <div class="titles">
          <strong id="word">Nook</strong>
          <span id="meters"></span>
          <button type="button" id="week-grid" aria-label="GitHub week"></button>
          <button type="button" id="pin" class="pin-mark" aria-label="Pin open"></button>
        </div>
      </header>
      <div id="drop-cue" class="drop-cue" hidden><span>Drop it here</span><small>Nook will keep it handy</small></div>
      <section class="details">
        <div id="card-approval" class="approval" hidden>
          <p class="approval-title" id="approval-title"></p>
          <p class="approval-detail" id="approval-detail"></p>
          <div id="questions" class="questions"></div>
          <div class="choices">
            <button type="button" class="choice" id="tuck">Later</button>
            <button type="button" class="choice allow" id="allow">Allow</button>
            <button type="button" class="choice always" id="always" hidden>Always</button>
            <button type="button" class="choice deny" id="deny">Deny</button>
            <button type="button" class="choice" id="terminal">Reply in terminal</button>
          </div>
        </div>

        <div id="card-diff" hidden>
          <button type="button" class="text-button" id="diff-back">Back</button>
          <pre id="diff" class="diff"></pre>
          <button type="button" class="text-button" id="open-diff" hidden>Open in VS Code</button>
        </div>

        <div id="card-chat" hidden>
          <div class="chat-heading"><button type="button" id="chat-back" class="text-button" aria-label="Back to activity">← Activity</button><span>Chat</span><button type="button" id="chat-settings" class="text-button">Models</button></div>
          <label class="model-row">
            Model
            <select id="provider"></select>
          </label>
          <div id="transcript" class="transcript"></div>
          <p class="file-chip" id="file-chip" hidden></p>
          <form id="chat-form" class="row">
            <input
              id="chat-input"
              type="text"
              maxlength="2000"
              placeholder="Ask, or drop a file"
              autocomplete="off"
            />
            <button type="submit" class="choice allow">Send</button>
          </form>
          <p class="hint" id="key-status"></p>
        </div>

        <div id="card-session">
          <p class="status" id="status">Quiet</p>
          <p class="hint" id="hint">Hover the top edge, or ask a model.</p>
          <div class="pills">
            <div id="sessions" class="pills"></div>
            <button type="button" class="pill" id="chat-pill">Chat</button>
          </div>
          <div id="extras" class="pills"></div>
          <div id="github-list" class="github-list" hidden></div>
          <ul id="ticker" class="activity"></ul>
          <button type="button" class="text-button" id="open-terminal">Open terminal</button>
        </div>
      </section>
    </div>
    <script src="lib/markdown.js"></script>
    <script src="lib/motion.js"></script>
    <script src="lib/seed.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
